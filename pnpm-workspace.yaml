packages:
  - "packages/*"

# pnpm 10 blocks dependency build scripts unless they are listed here. better-sqlite3
# and esbuild ship platform binaries through their install scripts, and biome's
# postinstall picks the matching native binary — blocking them makes tests fail with
# "Could not locate the bindings file" instead of a clear install error.
onlyBuiltDependencies:
  - "@biomejs/biome"
  - better-sqlite3
  - esbuild
