name: Desktop Shell CI & Release Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      formal_release:
        description: 'Enforce formal release gates including Apple signing/notarization (E-267)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The deployed daemon distribution the staged smoke check expands (AC 2). This is the
  # exact tree the installer carries inside the desktop resources: the daemon plus its
  # runtime dependencies and a bundled Node runtime.
  DAEMON_DEPLOY_DIR: ${{ github.workspace }}/.desktop-artifacts/daemon

jobs:
  # ============================================================================
  # Matrix: Windows, macOS, Ubuntu (AC 1, E-265)
  # Every runner must pass check, platform tests, staged smoke, and desktop build.
  # Any failure halts and blocks the entire release (E-265).
  # Note: CI does NOT claim automated end-to-end GUI interaction;
  # manual GUI verification is recorded separately per platform (AC 4, E-266).
  # ============================================================================
  desktop-matrix:
    name: Desktop CI / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            name: Windows (x64)
          - os: macos-latest
            platform: darwin
            name: macOS (Apple Silicon / x64)
          - os: ubuntu-latest
            platform: linux
            name: Linux (Ubuntu LTS x64)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS (E-260)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Rust toolchain for Tauri v2
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies (Ubuntu baseline, AC 3, E-258, E-268)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Upstream Platform Baselines (AC 8, E-260)
        run: node --no-warnings --experimental-strip-types packages/shell-desktop/launchers/verify-baselines.ts

      # The workspace check builds nothing, but two of its suites assert on the real
      # artifact: packages/web/test/packaging-pipeline.test.ts and the two shells'
      # packaging-pipeline tests read packages/web/dist. Produce the single build first
      # (M10-T4) so `pnpm -w check` sees the same dist the daemon and both shells consume.
      - name: Build Web Frontend Assets (M10-T4 single build)
        run: pnpm --filter @agent-scheduler/web build

      - name: Workspace Verification Check (pnpm -w check, AC 1, E-265)
        run: pnpm -w check

      - name: Linux Launcher & Pre-Flight Dependency Probing (AC 3, E-258)
        if: matrix.platform == 'linux'
        run: |
          bash packages/shell-desktop/launchers/linux-launcher.sh
          node --no-warnings --experimental-strip-types -e '
            import { executeLinuxPrecheck } from "./packages/shell-desktop/launchers/linux-launcher.ts";
            const outcome = executeLinuxPrecheck();
            console.log("Linux precheck exitCode:", outcome.exitCode);
            if (outcome.exitCode !== 0) process.exit(1);
          '

      - name: Verify Packaging Pipeline (M10-T4)
        run: pnpm --filter @agent-scheduler/shell-desktop verify-pipeline

      # Produce the real desktop daemon payload the staged smoke check expands. No stub
      # stands in for it (AC 2, E-209, E-257).
      - name: Produce Deployed Daemon Distribution (AC 2, E-209)
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$DAEMON_DEPLOY_DIR"
          mkdir -p "$(dirname "$DAEMON_DEPLOY_DIR")"
          pnpm --filter @agent-scheduler/daemon deploy --legacy --prod \
            --config.node-linker=hoisted "$DAEMON_DEPLOY_DIR"
          # Keep only this runner's runtime; a packaged product ships one platform.
          node packages/shell-desktop/launchers/prepare-daemon-package.mjs "$DAEMON_DEPLOY_DIR"
          # The staged smoke step consumes the distribution through the environment.
          echo "DESKTOP_DAEMON_PACKAGE_DIR=$DAEMON_DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Staged Unpack, Launch Spec & Real Daemon Smoke (AC 2, E-209, E-257, E-265)
        run: node --no-warnings --experimental-strip-types packages/shell-desktop/launchers/smoke-runner.ts

      # `cargo build --release` links the native shell; packaging is verified by the
      # M10-T4 pipeline step above. It is not presented as a packaging step (AC 1).
      - name: Build Tauri Desktop Shell (AC 1, E-265)
        run: |
          cd packages/shell-desktop/src-tauri
          cargo build --release

      - name: Evaluate macOS Signing & Notarization (AC 6, E-267)
        if: matrix.platform == 'darwin'
        id: macos-signing
        run: |
          signed=false
          notarized=false
          if [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then signed=true; fi
          if [ "$signed" = "true" ] && [ -n "${{ secrets.APPLE_ID }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            notarized=true
          fi
          if [ "$signed" != "true" ] || [ "$notarized" != "true" ]; then
            echo "::warning::macOS signing/notarization credentials missing. Artifacts are build verification only (E-267)."
          fi
          echo "is_signed=$signed" >> "$GITHUB_OUTPUT"
          echo "is_notarized=$notarized" >> "$GITHUB_OUTPUT"
          if [ "$signed" = "true" ] && [ "$notarized" = "true" ]; then
            echo "artifact_label=正式签名件" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_label=构建验证件" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Build Verification Artifacts (AC 4, E-266)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            ${{ env.DAEMON_DEPLOY_DIR }}
            packages/shell-desktop/src-tauri/target/release/desktop-shell*

  # ============================================================================
  # macOS signing/notarization gate (AC 6, E-267).
  # Kept as its own job so signing and notarization are both required explicitly
  # instead of one being inferred from the other.
  # ============================================================================
  macos-signing-gate:
    name: macOS Signing & Notarization Gate
    needs: [desktop-matrix]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.formal_release == true }}
    runs-on: macos-latest
    steps:
      - name: Require signing and notarization credentials (E-267)
        run: |
          if [ -z "${{ secrets.APPLE_CERTIFICATE }}" ] || [ -z "${{ secrets.APPLE_ID }}" ] || [ -z "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "::error::Formal release requested without macOS signing and notarization credentials; signed and notarized artifacts cannot be produced (E-267)."
            exit 1
          fi
          echo "Signing and notarization credentials present."

  # ============================================================================
  # Release Gate: Evaluates all matrix results and release policies (AC 1, AC 6, E-265, E-267)
  # ============================================================================
  release-verification:
    name: Release Gate Evaluation
    needs: [desktop-matrix, macos-signing-gate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Evaluate Three-Platform Release Matrix (AC 1, AC 6, E-265, E-267)
        env:
          MATRIX_RESULT: ${{ needs.desktop-matrix.result }}
          SIGNING_RESULT: ${{ needs.macos-signing-gate.result }}
          FORMAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.formal_release || false }}
        run: |
          node --no-warnings --experimental-strip-types -e '
            import { assertReleaseVerification } from "./packages/shell-desktop/src/platform-support.ts";

            const matrixPassed = process.env.MATRIX_RESULT === "success";
            if (!matrixPassed) {
              console.error(`Matrix did not pass (result=${process.env.MATRIX_RESULT}) - one or more platform jobs failed.`);
              process.exit(1);
            }

            const isFormal = process.env.FORMAL_RELEASE === "true";
            const signingGate = process.env.SIGNING_RESULT;
            const signingSatisfied = signingGate === "success";
            if (isFormal && !signingSatisfied) {
              console.error(`Formal release requires the macOS signing/notarization gate (result=${signingGate}).`);
              process.exit(1);
            }

            // Reaching this point means every platform job passed, so every step in
            // every job (workspace check, platform tests, staged smoke, shell build)
            // succeeded.
            const outcomes = [
              { platform: "win32", hostLabel: "windows-latest", workspaceCheckPassed: true, platformTestsPassed: true, smokePassed: true, shellBuildPassed: true },
              { platform: "darwin", hostLabel: "macos-latest", workspaceCheckPassed: true, platformTestsPassed: true, smokePassed: true, shellBuildPassed: true, isSigned: signingSatisfied, isNotarized: signingSatisfied },
              { platform: "linux", hostLabel: "ubuntu-latest", workspaceCheckPassed: true, platformTestsPassed: true, smokePassed: true, shellBuildPassed: true },
            ];

            console.log(`Matrix result: ${process.env.MATRIX_RESULT}; formal release: ${isFormal}; signing gate: ${signingGate}`);
            assertReleaseVerification(outcomes, { isFormalRelease: isFormal });
            console.log("Matrix gate passed. Full three-platform coverage verified.");
          '
