name: Desktop Shell CI & Release Verification

on:
  push:
    branches: [main]
    paths-ignore:
      # The knowledge base changes on every landing and never affects the product build.
      # docs/platform-support.md stays in scope: verify-baselines reads it (E-260).
      - 'docs/Agent任务调度器-开发文档/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/Agent任务调度器-开发文档/**'
  workflow_dispatch:
    inputs:
      formal_release:
        description: 'Enforce formal release gates including Apple signing/notarization (E-267)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The release gate reads the per-platform job and step conclusions of this run.
  actions: read

jobs:
  # ============================================================================
  # Matrix: Windows, macOS, Ubuntu (AC 1, E-265)
  # Every runner must pass the workspace check, the platform integration tests, the
  # desktop shell build and the staged smoke of the shipped daemon. Any failure blocks
  # the release; the gate job names the platform and the step (E-265).
  # CI does NOT claim automated end-to-end GUI interaction; GUI behaviour is recorded in
  # the manual acceptance checklist per platform (AC 4, E-266).
  # ============================================================================
  desktop-matrix:
    name: Desktop CI / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            name: Windows (x64)
            bundles: nsis,msi
            smoke_extension: msi
          - os: macos-latest
            platform: darwin
            name: macOS (Apple Silicon)
            bundles: app,dmg
            smoke_extension: dmg
          - os: ubuntu-latest
            platform: linux
            name: Linux (Ubuntu LTS x64)
            bundles: deb,appimage
            smoke_extension: deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS (E-260)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Setup Rust toolchain for Tauri v2
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies (Ubuntu baseline, AC 3, E-258, E-268)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/shell-desktop/src-tauri/target/release/deps
            packages/shell-desktop/src-tauri/target/release/build
            packages/shell-desktop/src-tauri/target/release/.fingerprint
          key: ${{ runner.os }}-cargo-${{ hashFiles('packages/shell-desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Upstream Platform Baselines (AC 8, E-260)
        run: node --no-warnings --experimental-strip-types packages/shell-desktop/launchers/verify-baselines.ts

      # The workspace check builds nothing, but two of its suites assert on the real
      # artifact: packages/web/test/packaging-pipeline.test.ts and the two shells'
      # packaging-pipeline tests read packages/web/dist. Produce the single build first
      # (M10-T4) so `pnpm -w check` sees the same dist the daemon and both shells consume.
      - name: Build Web Frontend Assets (M10-T4 single build)
        run: pnpm --filter @agent-scheduler/web build

      - name: Workspace Verification Check (pnpm -w check, AC 1, E-265)
        run: pnpm -w check

      # Native path, process-group and autostart adapters of this host (17 节「平台集成」).
      # They are part of `pnpm -w check` too; this step gives them their own verdict so the
      # release gate can name them when they are what failed.
      - name: Platform Integration Tests (AC 1, E-265)
        run: pnpm exec vitest run packages/daemon/test/platform

      - name: Linux Launcher & Pre-Flight Dependency Probing (AC 3, E-258)
        if: matrix.platform == 'linux'
        run: |
          bash packages/shell-desktop/launchers/linux-launcher.sh --check-only
          node --no-warnings --experimental-strip-types -e '
            import { executeLinuxPrecheck } from "./packages/shell-desktop/launchers/linux-launcher.ts";
            const outcome = executeLinuxPrecheck();
            console.log("Linux precheck exitCode:", outcome.exitCode);
            if (outcome.exitCode !== 0) process.exit(1);
          '

      - name: Verify Packaging Pipeline (M10-T4)
        run: pnpm --filter @agent-scheduler/shell-desktop verify-pipeline

      # The daemon distribution the installation carries under resources/daemon-runtime:
      # the daemon with its production dependencies and the pinned Node 22 runtime
      # (AC 2, E-209, E-257, E-260). tauri.conf.json lists it as a bundle resource.
      - name: Build Daemon Distribution (AC 2, E-257, E-260)
        run: pnpm --filter @agent-scheduler/shell-desktop build-daemon-distribution

      - name: Import Apple signing certificate for formal release (E-267)
        if: ${{ matrix.platform == 'darwin' && github.event_name == 'workflow_dispatch' && inputs.formal_release == true }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"
          keychain_password="$(openssl rand -hex 24)"
          certificate_path="${RUNNER_TEMP}/agent-scheduler-certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$certificate_path" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain
          signing_identity="$(security find-identity -v -p codesigning build.keychain | awk -F\" '/Developer ID Application/ {print $2; exit}')"
          test -n "$signing_identity"
          echo "APPLE_SIGNING_IDENTITY=$signing_identity" >> "$GITHUB_ENV"

      # Build the actual installer formats named in docs/platform-support.md. The staged
      # smoke below expands one of these bundles, rather than a cargo build directory, so
      # the release gate verifies the installation layout users receive (E-209, E-257).
      - name: Build Tauri Desktop Shell (AC 1, E-265)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @agent-scheduler/shell-desktop tauri build --bundles "${{ matrix.bundles }}" --ci --verbose

      - name: Verify and Name Installer Assets (E-259, E-265)
        shell: bash
        run: |
          set -euo pipefail
          bundle_root=packages/shell-desktop/src-tauri/target/release/bundle
          mkdir -p release-assets
          case "${{ matrix.platform }}" in
            win32)
              nsis="$(find "$bundle_root/nsis" -maxdepth 1 -type f -name '*-setup.exe' -print -quit)"
              msi="$(find "$bundle_root/msi" -maxdepth 1 -type f -name '*.msi' -print -quit)"
              test -n "$nsis" && test -n "$msi"
              cp "$nsis" release-assets/agsched-desktop_x64-setup.exe
              cp "$msi" release-assets/agsched-desktop_x64.msi
              ;;
            darwin)
              dmg="$(find "$bundle_root/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
              test -n "$dmg"
              cp "$dmg" release-assets/agsched-desktop_aarch64.dmg
              ;;
            linux)
              deb="$(find "$bundle_root/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)"
              appimage="$(find "$bundle_root/appimage" -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
              test -n "$deb" && test -n "$appimage"
              cp "$deb" release-assets/agsched-desktop_amd64.deb
              cp "$appimage" release-assets/agsched-desktop_amd64.AppImage
              ;;
            *) echo "Unsupported platform: ${{ matrix.platform }}" >&2; exit 1 ;;
          esac

      # Expands the installation payload into a temporary root with spaces and Unicode,
      # resolves the frozen launch spec from the expanded current_exe/resource_dir the way
      # the native shell does, and really starts the shipped daemon through it until its
      # health endpoint answers. The daemon's machine-wide instance lock lives in a
      # root-owned directory on POSIX (/var/lib on Linux, /Library/Application Support on
      # macOS), so the check runs with sudo there; the Windows runner is already elevated.
      - name: Staged Unpack, Launch Spec & Real Daemon Smoke (AC 2, E-209, E-257, E-265)
        shell: bash
        env:
          DESKTOP_SMOKE_PORT: '7817'
        run: |
          set -euo pipefail
          bundle_path="$(find release-assets -maxdepth 1 -type f -name '*.${{ matrix.smoke_extension }}' -print -quit)"
          test -n "$bundle_path"
          echo "Using real Tauri bundle: $bundle_path"
          export DESKTOP_BUNDLE_PATH="$bundle_path"
          if [ "${{ matrix.platform }}" = "win32" ]; then
            node --no-warnings --experimental-strip-types packages/shell-desktop/launchers/smoke-runner.ts
          else
            sudo -E "$(command -v node)" --no-warnings --experimental-strip-types packages/shell-desktop/launchers/smoke-runner.ts
          fi

      # M10-T6 AC 3 (E-257, E-265): the real shell executable against the real shipped
      # daemon. The stage starts the daemon from the same frozen launch spec, pairs a real
      # device over POST /api/v1/pair/claim, then starts the shell with AGSCHED_SMOKE=1
      # (through xvfb-run on Linux, which has no X display). The shell itself polls
      # data-style-loaded and data-connection-status out of the loaded page and exits 0
      # only when both hold within 20s.
      # It asserts nothing about clicks, notifications or window behaviour: those stay on
      # the per-platform manual checklist (E-266).
      - name: Desktop Shell Smoke (AC 3, E-257, E-265, E-266)
        shell: bash
        env:
          DESKTOP_SMOKE_PORT: '7817'
        run: |
          set -euo pipefail
          bundle_path="$(find release-assets -maxdepth 1 -type f -name '*.${{ matrix.smoke_extension }}' -print -quit)"
          test -n "$bundle_path"
          echo "Using real Tauri bundle for the shell smoke: $bundle_path"
          export DESKTOP_BUNDLE_PATH="$bundle_path"
          if [ "${{ matrix.platform }}" = "win32" ]; then
            node --no-warnings --experimental-strip-types packages/shell-desktop/launchers/smoke-runner.ts shell
          else
            sudo -E "$(command -v node)" --no-warnings --experimental-strip-types packages/shell-desktop/launchers/smoke-runner.ts shell
          fi

      - name: Label macOS Signing & Notarization Status (AC 6, E-267)
        if: matrix.platform == 'darwin'
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.formal_release || false }}" != "true" ]; then
            echo "::warning::macOS signing/notarization credentials missing. Artifacts are build verification only (E-267)."
          else
            echo "Formal release requested; the macOS signing gate will verify codesign, Gatekeeper and stapling against the built bundle."
          fi

      - name: Upload Build Verification Artifacts (AC 4, E-266, E-267)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-build-verification-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release-assets/**

  # ============================================================================
  # Production Pairing Smoke: Ubuntu CI (M9-T27, AC 4, E-265)
  # Boots the real daemon with packages/daemon/bootstrap.mjs against a clean
  # Web production build and fresh temporary data directory. Playwright launches
  # headless Chromium to assert hash normalization from `/` to `#/pair`, editable
  # address/code inputs, operable confirm button, claim flow into `#/`, and
  # CSS/font loading under both desktop and mobile viewports.
  # ============================================================================
  pairing-smoke:
    name: Production Pairing Smoke (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS (E-260)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Production Pairing Smoke (AC 4, E-265)
        shell: bash
        run: |
          pnpm_bin="$(command -v pnpm)"
          sudo -E env "PATH=$PATH" "$pnpm_bin" smoke:pair

      - name: Upload Pairing Smoke Failure Artifacts (AC 3)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pairing-smoke-failure-artifacts
          path: e2e/artifacts/**
          if-no-files-found: ignore
          retention-days: 7

  # ============================================================================
  # macOS signing/notarization gate (AC 6, E-267).
  # Kept as its own job so signing and notarization are both required explicitly
  # instead of one being inferred from the other.
  # ============================================================================
  macos-signing-gate:
    name: macOS Signing & Notarization Gate
    needs: [desktop-matrix]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.formal_release == true }}
    runs-on: macos-latest
    steps:
      - name: Download built macOS bundle
        uses: actions/download-artifact@v4
        with:
          name: desktop-build-verification-darwin
          path: ${{ runner.temp }}/macos-bundle

      - name: Verify signing, Gatekeeper assessment and notarization ticket (E-267)
        run: |
          set -euo pipefail
          dmg_path="$(find "${RUNNER_TEMP}/macos-bundle" -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mkdir -p "${RUNNER_TEMP}/mounted"
          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "${RUNNER_TEMP}/mounted"
          trap 'hdiutil detach "${RUNNER_TEMP}/mounted" -force' EXIT
          app_path="$(find "${RUNNER_TEMP}/mounted" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"

  # ============================================================================
  # Release Gate: reads every platform job and its steps back from the API and feeds
  # the real conclusions to assertReleaseVerification, so a failing platform is named
  # together with the step that failed (AC 1, AC 6, E-265, E-267).
  # ============================================================================
  release-verification:
    name: Release Gate Evaluation
    needs: [desktop-matrix, macos-signing-gate, pairing-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce Pairing Smoke Gate (M9-T27, E-265)
        if: ${{ needs.pairing-smoke.result != 'success' }}
        run: |
          echo "::error::Production pairing smoke on Ubuntu failed (result: ${{ needs.pairing-smoke.result }})."
          exit 1

      - name: Collect platform job conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > "${{ runner.temp }}/jobs.json"

      - name: Evaluate Three-Platform Release Matrix (AC 1, AC 6, E-265, E-267)
        env:
          SIGNING_GATE_RESULT: ${{ needs.macos-signing-gate.result }}
          FORMAL_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.formal_release || false }}
        run: node --no-warnings --experimental-strip-types packages/shell-desktop/launchers/evaluate-release-gate.ts "${{ runner.temp }}/jobs.json"
