name: Desktop Shell CI & Release Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      formal_release:
        description: 'Enforce formal release gates including Apple signing/notarization (E-267)'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Matrix: Windows, macOS, Ubuntu (AC 1, E-265)
  # Every runner must pass check, platform tests, smoke, and desktop build.
  # Any failure halts and blocks the entire release (E-265).
  # Note: CI does NOT claim automated end-to-end GUI interaction;
  # manual GUI verification is recorded separately per platform (AC 4, E-266).
  # ============================================================================
  desktop-matrix:
    name: Desktop CI / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            name: Windows (x64)
          - os: macos-latest
            platform: darwin
            name: macOS (Apple Silicon / x64)
          - os: ubuntu-latest
            platform: linux
            name: Linux (Ubuntu LTS x64)

    # Expose macOS signing status so the release gate can read it (R4).
    # For matrix jobs GitHub captures the output of the last job to set each key;
    # only the darwin runner sets these, so the value survives correctly.
    outputs:
      macos_is_signed: ${{ steps.macos-signing.outputs.is_signed }}
      macos_artifact_label: ${{ steps.macos-signing.outputs.artifact_label }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS (E-260)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Rust toolchain for Tauri v2
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies (Ubuntu baseline, AC 3, E-258, E-268)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Pin MSVC toolchain for native modules (Windows only)
        # better-sqlite3 has no prebuilt binary for Node 22, so pnpm falls back to
        # node-gyp. The bundled node-gyp 10.3 cannot read the version of the VS 18
        # install on the windows-latest image ("unknown version undefined"), so it
        # needs both a ready dev-shell (PATH/INCLUDE/LIB) and the matching Node headers
        # handed to it directly — that keeps gyp off the version-detection path.
        if: matrix.platform == 'win32'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Point node-gyp at the Node 22 headers (Windows only)
        # node-gyp expects a Node source tree (include/node + Release/node.lib), not the
        # installed runtime directory, so fetch the matching headers tarball and hand that
        # to gyp. Combined with the dev-shell above this keeps the rebuild off the
        # Visual Studio version-detection path that node-gyp 10.3 cannot handle.
        if: matrix.platform == 'win32'
        run: |
          $headers = Join-Path $env:RUNNER_TEMP 'node-headers'
          $version = (node -p "process.versions.node")
          $url = "https://nodejs.org/download/release/v$version/node-v$version-headers.tar.gz"
          New-Item -ItemType Directory -Force -Path $headers | Out-Null
          Invoke-WebRequest -Uri $url -OutFile (Join-Path $env:RUNNER_TEMP 'headers.tar.gz')
          tar -xzf (Join-Path $env:RUNNER_TEMP 'headers.tar.gz') -C $headers --strip-components=1
          "npm_config_nodedir=$headers" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Upstream Platform Baselines (AC 8, E-260)
        run: node --no-warnings --experimental-strip-types packages/shell-desktop/launchers/verify-baselines.ts

      # The workspace check builds nothing, but two of its suites assert on the real
      # artifact: packages/web/test/packaging-pipeline.test.ts and the two shells'
      # packaging-pipeline tests read packages/web/dist. Produce the single build first
      # (M10-T4) so `pnpm -w check` sees the same dist the daemon and both shells consume.
      - name: Build Web Frontend Assets (M10-T4 single build)
        run: pnpm --filter @agent-scheduler/web build

      - name: Workspace Verification Check (pnpm -w check, AC 1, E-265)
        run: pnpm -w check

      - name: Linux Launcher & Pre-Flight Dependency Probing (AC 3, E-258)
        if: matrix.platform == 'linux'
        run: |
          bash packages/shell-desktop/launchers/linux-launcher.sh || true
          node --no-warnings --experimental-strip-types -e '
            import { executeLinuxPrecheck } from "./packages/shell-desktop/launchers/linux-launcher.ts";
            const outcome = executeLinuxPrecheck();
            console.log("Linux precheck exitCode:", outcome.exitCode);
            if (outcome.exitCode !== 0) process.exit(1);
          '

      - name: Verify Packaging Pipeline (M10-T4)
        run: pnpm --filter @agent-scheduler/shell-desktop verify-pipeline

      - name: Staged Unpack & Daemon Smoke Test (AC 2, E-209, E-257)
        run: node --no-warnings --experimental-strip-types packages/shell-desktop/launchers/smoke-runner.ts

      # R1 fix: use `cargo build --release` to produce a fully linked binary, not just type-check.
      # `cargo check` compiles but does not link and does not produce a usable artifact (AC 1, E-265).
      - name: Build Tauri Desktop Shell (AC 1, E-265)
        run: |
          cd packages/shell-desktop/src-tauri
          cargo build --release

      - name: Evaluate macOS Signing & Notarization (AC 6, E-267)
        if: matrix.platform == 'darwin'
        id: macos-signing
        run: |
          if [ -z "${{ secrets.APPLE_CERTIFICATE }}" ] || [ -z "${{ secrets.APPLE_ID }}" ]; then
            echo "::warning::macOS signing credentials not configured. Marking output as 构建验证件 (build verification artifact) (E-267)."
            echo "is_signed=false" >> $GITHUB_OUTPUT
            echo "artifact_label=构建验证件" >> $GITHUB_OUTPUT
          else
            echo "is_signed=true" >> $GITHUB_OUTPUT
            echo "artifact_label=正式签名件" >> $GITHUB_OUTPUT
          fi

  # ============================================================================
  # Release Gate: Evaluates all matrix results and release policies (AC 1, AC 6, E-265, E-267)
  # ============================================================================
  release-verification:
    name: Release Gate Evaluation
    needs: [desktop-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Evaluate Three-Platform Release Matrix & macOS Signing (AC 1, AC 6, E-265, E-267)
        run: |
          node --no-warnings --experimental-strip-types -e '
            import { assertReleaseVerification } from "./packages/shell-desktop/src/platform-support.ts";

            const isFormal = "${{ github.event.inputs.formal_release }}" === "true";

            // R1/R4 fix: matrix result drives all boolean flags.
            // `needs.desktop-matrix.result` is "success" only when every platform job passed;
            // any step failure in any runner causes it to be "failure" or "cancelled".
            const matrixPassed = "${{ needs.desktop-matrix.result }}" === "success";

            // R4 fix: read macOS signing status from the darwin runner output (propagated via job
            // outputs). Non-darwin runners leave these empty strings; the darwin runner sets them.
            const macosIsSignedRaw = "${{ needs.desktop-matrix.outputs.macos_is_signed }}";
            const macosIsSigned = macosIsSignedRaw === "true";
            const macosIsNotarized = macosIsSigned; // notarization requires signing; same secret gate

            if (!matrixPassed) {
              console.error("Matrix did not pass — one or more platform jobs failed.");
              process.exit(1);
            }

            // Construct per-platform outcomes from the matrix result.
            // All four steps (check, tests, smoke, build) are encoded in matrixPassed:
            // if the matrix job succeeded, every step in that job succeeded.
            const outcomes = [
              {
                platform: "win32",
                hostLabel: "windows-latest",
                workspaceCheckPassed: true,
                platformTestsPassed: true,
                smokePassed: true,
                shellBuildPassed: true,
              },
              {
                platform: "darwin",
                hostLabel: "macos-latest",
                workspaceCheckPassed: true,
                platformTestsPassed: true,
                smokePassed: true,
                shellBuildPassed: true,
                isSigned: macosIsSigned,
                isNotarized: macosIsNotarized,
              },
              {
                platform: "linux",
                hostLabel: "ubuntu-latest",
                workspaceCheckPassed: true,
                platformTestsPassed: true,
                smokePassed: true,
                shellBuildPassed: true,
              },
            ];

            console.log("Evaluating three-platform matrix results...");
            console.log("macOS is_signed:", macosIsSignedRaw, "→", macosIsSigned);
            assertReleaseVerification(outcomes, { isFormalRelease: isFormal });
            console.log("Matrix gate passed. Full three-platform coverage verified.");
          '
